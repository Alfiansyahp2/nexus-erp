name: Frontend CI (React/Vite)

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'frontend/**'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: npm run build
      
    # Uncomment if you have linters configured in package.json (e.g. ESLint)
    # - name: Lint Code
    #   run: npm run lint

    # Uncomment if you have tests configured (e.g. Jest or Vitest)
    # - name: Run Tests
    #   run: npm run test
